<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Coming soon">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b27a"/>
      <stop offset="1" stop-color="#b8692f"/>
    </linearGradient>
  </defs>
  <style>
    .spin{transform-origin:32px 32px;animation:spin 12s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  </style>
  <rect width="64" height="64" rx="16" fill="#121a24"/>
  <circle class="spin" cx="32" cy="32" r="18" fill="none" stroke="url(#copper)" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>
  <path d="M32 24 V40 M24 32 H40" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
