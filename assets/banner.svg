<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Sanalarge: software, electronics and AI-driven engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#d98a4b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d98a4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b27a"/>
      <stop offset="1" stop-color="#b8692f"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2633"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="380" rx="22"/>
    </clipPath>
  </defs>
  <style>
    .trace{fill:none;stroke:#3b2d22;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:none;stroke:#f0a965;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 91;animation:run 5s linear infinite}
    .cyan{stroke:#5eead4}
    .d1{animation-delay:-1.2s}
    .d2{animation-delay:-2.5s}
    .d3{animation-delay:-3.7s}
    .pad{fill:#0a0f16;stroke:#c27a3e;stroke-width:3}
    .pin{stroke:#8a96a3;stroke-width:4;stroke-linecap:round}
    .eyebrow{font:600 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:4px;fill:#e6a46a}
    .title{font:700 66px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:9px;fill:#f5f1ea}
    .lead{font:400 21px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#9aa8b6}
    .chip{fill:#121a24;stroke:#273343;stroke-width:1.5}
    .chiptext{font:600 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#d5dde5}
    .mono{font:600 13px ui-monospace,'Cascadia Code',Consolas,monospace;letter-spacing:2px;fill:#6f7d8b}
    .ai{font:700 40px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:url(#copper)}
    .blink{animation:blink 2.4s ease-in-out infinite}
    @keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.pulse,.blink{animation:none}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <g>
      <path class="trace" d="M860 145 H795 L760 110 H725"/>
      <path class="trace" d="M860 190 H720"/>
      <path class="trace" d="M860 235 H805 L770 270 V325"/>
      <path class="trace" d="M1030 150 H1090 L1120 120 V58"/>
      <path class="trace" d="M1030 190 H1165"/>
      <path class="trace" d="M1030 235 H1100 L1130 265 V330"/>
      <path class="trace" d="M915 105 V68 L945 38 H1010"/>
      <path class="trace" d="M975 275 V335"/>

      <path class="pulse" pathLength="100" d="M860 145 H795 L760 110 H725"/>
      <path class="pulse cyan d2" pathLength="100" d="M860 190 H720"/>
      <path class="pulse d1" pathLength="100" d="M860 235 H805 L770 270 V325"/>
      <path class="pulse d3" pathLength="100" d="M1030 150 H1090 L1120 120 V58"/>
      <path class="pulse cyan d1" pathLength="100" d="M1030 190 H1165"/>
      <path class="pulse d2" pathLength="100" d="M1030 235 H1100 L1130 265 V330"/>
      <path class="pulse cyan d3" pathLength="100" d="M915 105 V68 L945 38 H1010"/>
      <path class="pulse" pathLength="100" d="M975 275 V335"/>

      <circle class="pad" cx="725" cy="110" r="7"/>
      <circle class="pad" cx="720" cy="190" r="7"/>
      <circle class="pad" cx="770" cy="325" r="7"/>
      <circle class="pad" cx="1120" cy="58" r="7"/>
      <circle class="pad" cx="1165" cy="190" r="7"/>
      <circle class="pad" cx="1130" cy="330" r="7"/>
      <circle class="pad" cx="1010" cy="38" r="7"/>
      <circle class="pad" cx="975" cy="335" r="7"/>
    </g>

    <g>
      <line class="pin" x1="885" y1="95" x2="885" y2="105"/>
      <line class="pin" x1="915" y1="95" x2="915" y2="105"/>
      <line class="pin" x1="945" y1="95" x2="945" y2="105"/>
      <line class="pin" x1="975" y1="95" x2="975" y2="105"/>
      <line class="pin" x1="1005" y1="95" x2="1005" y2="105"/>
      <line class="pin" x1="885" y1="275" x2="885" y2="285"/>
      <line class="pin" x1="915" y1="275" x2="915" y2="285"/>
      <line class="pin" x1="945" y1="275" x2="945" y2="285"/>
      <line class="pin" x1="975" y1="275" x2="975" y2="285"/>
      <line class="pin" x1="1005" y1="275" x2="1005" y2="285"/>
      <line class="pin" x1="850" y1="145" x2="860" y2="145"/>
      <line class="pin" x1="850" y1="190" x2="860" y2="190"/>
      <line class="pin" x1="850" y1="235" x2="860" y2="235"/>
      <line class="pin" x1="1030" y1="150" x2="1040" y2="150"/>
      <line class="pin" x1="1030" y1="190" x2="1040" y2="190"/>
      <line class="pin" x1="1030" y1="235" x2="1040" y2="235"/>
      <rect x="860" y="105" width="170" height="170" rx="16" fill="url(#die)" stroke="#2c3949" stroke-width="2"/>
      <rect x="890" y="135" width="110" height="110" rx="10" fill="none" stroke="url(#copper)" stroke-width="2" stroke-opacity="0.8"/>
      <text class="ai" x="945" y="203" text-anchor="middle">AI</text>
      <circle class="blink" cx="878" cy="123" r="4" fill="#5eead4"/>
      <text class="mono" x="945" y="265" text-anchor="middle">SNL-01</text>
    </g>

    <text class="eyebrow" x="70" y="96">ENGINEERING STUDIO</text>
    <text class="title" x="66" y="172">SANALARGE</text>
    <rect x="70" y="192" width="84" height="4" rx="2" fill="url(#copper)"/>
    <text class="lead" x="70" y="235">Software, electronics and AI-driven engineering</text>
    <text class="lead" x="70" y="263">from first sketch to schematic, CAD and production.</text>

    <g>
      <rect class="chip" x="70" y="296" width="96" height="34" rx="17"/>
      <text class="chiptext" x="118" y="318" text-anchor="middle">Software</text>
      <rect class="chip" x="176" y="296" width="122" height="34" rx="17"/>
      <text class="chiptext" x="237" y="318" text-anchor="middle">Electronics</text>
      <rect class="chip" x="308" y="296" width="72" height="34" rx="17"/>
      <text class="chiptext" x="344" y="318" text-anchor="middle">PCB</text>
      <rect class="chip" x="390" y="296" width="108" height="34" rx="17" stroke="#2f6f66"/>
      <text class="chiptext" x="444" y="318" text-anchor="middle" fill="#7ef0dc">AI Tools</text>
      <rect class="chip" x="508" y="296" width="64" height="34" rx="17"/>
      <text class="chiptext" x="540" y="318" text-anchor="middle">CAD</text>
      <rect class="chip" x="582" y="296" width="118" height="34" rx="17"/>
      <text class="chiptext" x="641" y="318" text-anchor="middle">Open Source</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  </g>
</svg>
